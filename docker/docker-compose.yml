# Local development: Postgres + Redis only. The api runs on the host via
# `poetry run uvicorn app.main:app --reload` (see `make run`), reading its
# config from the repo-root .env, whose defaults already point at these
# containers on localhost. Run from the repo root:
#   docker compose -f docker/docker-compose.yml up -d
#
# Credentials are hardcoded dev values on purpose.
#
# Ports 5432/6379 collide with docker-compose-test.yml, bring that stack down first.

name: relayix

services:
  db:
    image: postgres:16
    container_name: relayix_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: relayix
      POSTGRES_DB: relayix_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d relayix_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: relayix_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
