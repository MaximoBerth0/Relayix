# Tests on every push to main, then builds the arm64 image and pushes it to ECR
# tagged with the commit sha. Deploy is `terraform apply -var image_tag=<sha>`.
# Needs repo variables AWS_REGION and AWS_ROLE_ARN (terraform output github_actions_role_arn).

name: CI/CD

on:
  push:
    branches: [main]

env:
  POETRY_VERSION: "2.4.1"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # mirrors docker/docker-compose-test.yml
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Cache the virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-root

      - name: Run tests
        run: poetry run pytest -v

  build-and-push:
    name: Build and push image
    needs: test
    # native arm64 runner, the Fargate tasks run on Graviton
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          # the ECR repo is immutable, so only the sha tag
          tags: ${{ steps.ecr.outputs.registry }}/relayix:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
